name: Brain Sync

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15

      - name: Sync to Brain Vault
        run: |
          COMMITS=$(git log --oneline -10 | head -c 2000)
          CHANGED=$(git diff --name-only HEAD~1 2>/dev/null | head -c 500 || echo "")
          python3 -c "
import json, urllib.request, os, sys

commits = sys.argv[1]
changed = sys.argv[2]

payload = json.dumps({
  'project':     os.environ['PROJECT_NAME'],
  'repo':        os.environ['GITHUB_REPOSITORY'],
  'description': os.environ.get('PROJECT_DESCRIPTION', ''),
  'commits':     commits,
  'changedFiles': changed,
}).encode()

req = urllib.request.Request(
  'https://brain-voice-worker.pfeffer-thomas8.workers.dev/sync-project',
  data=payload,
  headers={
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + os.environ['BRAIN_SYNC_SECRET'],
  },
  method='POST'
)
try:
  with urllib.request.urlopen(req, timeout=30) as res:
    print(res.read().decode())
except Exception as e:
  print('Error:', e)
  sys.exit(1)
" "$COMMITS" "$CHANGED"
        env:
          BRAIN_SYNC_SECRET: ${{ secrets.BRAIN_SYNC_SECRET }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          PROJECT_DESCRIPTION: ${{ vars.PROJECT_DESCRIPTION }}
