name: Brain Sync

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15

      - name: Collect project info
        id: info
        run: |
          COMMITS=$(git log --oneline -10)
          CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || echo "initial commit")
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sync to Brain Vault
        run: |
          curl -s -X POST https://brain-voice-worker.pfeffer-thomas8.workers.dev/sync-project \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.BRAIN_SYNC_SECRET }}" \
            -d "{\"project\": \"${{ vars.PROJECT_NAME }}\", \"repo\": \"${{ github.repository }}\", \"description\": \"${{ vars.PROJECT_DESCRIPTION }}\", \"commits\": $(echo '${{ steps.info.outputs.commits }}' | python3 -c \"import json,sys; print(json.dumps(sys.stdin.read()))\"), \"changedFiles\": $(echo '${{ steps.info.outputs.changed }}' | python3 -c \"import json,sys; print(json.dumps(sys.stdin.read()))\")}"
