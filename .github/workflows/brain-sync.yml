name: Brain Sync

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15

      - name: Sync to Brain Vault
        env:
          BRAIN_SYNC_SECRET: ${{ secrets.BRAIN_SYNC_SECRET }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          PROJECT_DESCRIPTION: ${{ vars.PROJECT_DESCRIPTION }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import subprocess, json, urllib.request, os

          commits = subprocess.check_output(
            ['git', 'log', '--oneline', '-10'], text=True
          ).strip()

          try:
            changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD~1'], text=True
            ).strip()
          except:
            changed = "initial commit"

          payload = json.dumps({
            "project":      os.environ["PROJECT_NAME"],
            "repo":         os.environ["REPO"],
            "description":  os.environ["PROJECT_DESCRIPTION"],
            "commits":      commits,
            "changedFiles": changed,
          }).encode()

          req = urllib.request.Request(
            "https://brain-voice-worker.pfeffer-thomas8.workers.dev/sync-project",
            data=payload,
            headers={
              "Content-Type": "application/json",
              "Authorization": f"Bearer {os.environ['BRAIN_SYNC_SECRET']}",
            },
            method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as res:
            print(res.read().decode())
          EOF
