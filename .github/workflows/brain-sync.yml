name: Brain Sync

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - name: Sync to Brain Vault
        env:
          BRAIN_SYNC_SECRET: ${{ secrets.BRAIN_SYNC_SECRET }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          PROJECT_DESCRIPTION: ${{ vars.PROJECT_DESCRIPTION }}
        run: python3 .github/scripts/brain_sync.py
